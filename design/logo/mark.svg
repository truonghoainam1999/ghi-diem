<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>Ghi Điểm — Chia làm khung</title>
  <desc>Dấu chia làm bộ xương: nét ngang dài, hai chấm thay bằng dấu cộng ở trên và dấu nhân ở dưới. Nét ngang cũng chính là dấu trừ.</desc>
  <g stroke="currentColor" stroke-width="10" stroke-linecap="round" fill="none">
    <line x1="14" y1="50" x2="86" y2="50"/>
    <line x1="42" y1="24" x2="58" y2="24"/>
    <line x1="50" y1="16" x2="50" y2="32"/>
    <line x1="43" y1="69" x2="57" y2="83"/>
    <line x1="57" y1="69" x2="43" y2="83"/>
  </g>
</svg>
